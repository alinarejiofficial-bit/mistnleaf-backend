{% extends "website/base.html" %}
{% block content %}
{% include "website/includes/page_intro.html" with title=title %}
<section class="mx-auto w-full max-w-3xl px-5 py-14 sm:px-6 pt-0 space-y-6">
  {% for item in faqs %}
  <details class="border border-line bg-fog/60 p-4"><summary class="font-medium text-pine cursor-pointer">{{ item.q }}</summary><p class="mt-3 text-sm text-muted">{{ item.a }}</p></details>
  {% endfor %}
</section>
{% endblock %}
