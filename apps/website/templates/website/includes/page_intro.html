<header class="mx-auto max-w-3xl px-5 pb-8 pt-24 text-center sm:px-6 md:pb-12 md:pt-36">
  {% if eyebrow %}<div class="mb-4 flex justify-center"><p class="eyebrow inline-flex items-center">{{ eyebrow }}</p></div>{% endif %}
  <h1 class="font-display text-balance text-[2rem] text-pine sm:text-4xl md:text-5xl">{{ title }}</h1>
  {% if lead %}<p class="mx-auto mt-4 max-w-2xl text-[0.98rem] leading-relaxed text-muted sm:mt-5 sm:text-base md:text-lg">{{ lead }}</p>{% endif %}
</header>
